[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stargazer"
version = "0.1.0"
description = "Bioinformatics workflow orchestration system combining IPFS storage with Flyte v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=24.1.0",
    "flyte[tui]>=2.0.3",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "tinydb>=4.8.2",
]

[project.optional-dependencies]
bio = [
    "scanpy>=1.12",
    "anndata>=0.12.10",
    "scikit-image>=0.26.0",
    "igraph>=1.0.0",
    "pooch>=1.9.0",
]
notebook = ["marimo>=0.10.0", "stargazer[bio]"]
# Bounded to the 2.x major: SDK 2.0 renamed the high-level server class
# (`FastMCP` → `MCPServer`, `mcp.server.fastmcp` → `mcp.server`), so an
# unbounded range silently resolves across a breaking rename.
mcp = ["mcp[cli]>=2.0,<3"]
landing = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=43",
]
docs = ["mkdocstrings[python]>=1.0.3"]
app = ["stargazer[notebook,landing]"]
all = ["stargazer[notebook,mcp,landing,docs]"]

[project.scripts]
stargazer = "stargazer.server:main"
stargazer-app = "app.admin_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "pinata: tests that require Pinata API access (PINATA_JWT)",
]
filterwarnings = [
    # Ignore Pydantic deprecation warnings from flyte package (third-party)
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["stargazer*", "app*"]

[tool.setuptools.package-data]
stargazer = ["bundles/*.yaml", "notebooks/*.py"]
app = ["templates/*.html"]

[dependency-groups]
dev = [
    "mkdocstrings[python]>=1.0.3",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    # Pinned to the same minor as .pre-commit-config.yaml's ruff rev — a
    # floating range let the lock drift to a ruff whose *default* rule set
    # differed from the pinned hook's. Bump both together.
    "ruff>=0.16.2,<0.17",
    "zensical>=0.0.24",
]

# Rule selection is ruff's default for the pinned version (see the ruff pin in
# [dependency-groups] and the matching rev in .pre-commit-config.yaml — bump
# them together). Only deliberate, reviewed exceptions are listed below.
[tool.ruff.lint]
ignore = [
    # Graceful degradation is the app tier's design: a failed GitHub call, pod
    # probe, or teardown must never take a request down, so handlers catch
    # broadly and log. Narrowing these is actively harmful — a too-narrow
    # `except` in the proxy's cookie gate turned a clean 401 into a 500.
    "BLE001",
    # Implicit concatenation inside a collection is how multi-line shell
    # commands are written in `flyte.Image(...).with_commands([...])`.
    # Parenthesizing each would add noise to every image recipe.
    "ISC004",
    # try-except-pass. All sites reviewed and deliberate: best-effort pod
    # probes that fall back to GitHub, idempotent teardown of possibly-absent
    # apps, get-or-create existence probes, a readiness check, and the child
    # side of `pty.fork()` where logging is unsafe.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# A marimo cell ends with a bare expression — that IS the render mechanism, not
# a useless statement. Applies to every notebook surface.
"src/stargazer/notebooks/**" = ["B018"]
# The PTY/fork path deliberately uses blocking primitives: the pseudo-terminal
# master fd is long-lived (no context manager), and reaping the child needs a
# blocking wait.
"app/proxy.py" = ["ASYNC222", "SIM115"]
# Streaming uploads hand a live file object to the HTTP client, so it outlives
# any `with` block and is closed by the client.
"src/stargazer/utils/pinata.py" = ["ASYNC230", "SIM115"]
# Task bodies are async for Flyte's benefit but do genuinely blocking local
# file I/O on the pod's own disk.
"src/stargazer/tasks/**" = ["ASYNC230"]
